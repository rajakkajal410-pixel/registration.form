<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Registration Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffd6e8, #d8c7ff, #c7f0ff);
        }

        .container {
            width: 400px;
            padding: 35px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #4b3b5a;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            color: #4b3b5a;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: none;
            outline: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }

        input:focus,
        select:focus {
            box-shadow: 0 0 0 3px rgba(150, 100, 200, 0.2);
        }

        .gender {
            display: flex;
            gap: 20px;
            margin: 10px 0;
        }

        .gender label {
            font-weight: normal;
            margin: 0;
        }

        .gender input {
            width: auto;
            margin-right: 5px;
        }

        .terms {
            margin: 18px 0;
            font-size: 13px;
            color: #555;
        }

        .terms input {
            width: auto;
            margin-right: 6px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(90deg, #a56cff, #ff79b0);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(165, 108, 255, 0.35);
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Create Account ✨</h1>
        <p class="subtitle">Join us and start your journey</p>

        <form>

            <label>Full Name</label>
            <input type="text" placeholder="Enter your full name" required>

            <label>Email Address</label>
            <input type="email" placeholder="Enter your email" required>

            <label>Phone Number</label>
            <input type="tel" placeholder="Enter your phone number" required>

            <label>Date of Birth</label>
            <input type="date" required>

            <label>Gender</label>

            <div class="gender">
                <label>
                    <input type="radio" name="gender"> Male
                </label>

                <label>
                    <input type="radio" name="gender"> Female
                </label>

                <label>
                    <input type="radio" name="gender"> Other
                </label>
            </div>

            <label>Country</label>
            <select required>
                <option value="">Select your country</option>
                <option>India</option>
                <option>USA</option>
                <option>UK</option>
                <option>Canada</option>
                <option>Australia</option>
            </select>

            <label>Password</label>
            <input type="password" placeholder="Create a password" required>

            <label>Confirm Password</label>
            <input type="password" placeholder="Confirm your password" required>

            <div class="terms">
                <label>
                    <input type="checkbox" required>
                    I agree to the Terms & Conditions
                </label>
            </div>

            <button type="submit">Create Account →</button>

        </form>

    </div>

</body>
</html>
